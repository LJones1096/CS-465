
<div class="container mt-4">
  <h2>Add New Trip</h2>

  <form (ngSubmit)="addTrip()">

    <div class="mb-3">
      <label class="form-label">Trip Code</label>
      <input type="text" class="form-control"
             name="code" [(ngModel)]="trip.code" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Trip Name</label>
      <input type="text" class="form-control"
             name="name" [(ngModel)]="trip.name" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Length</label>
      <input type="text" class="form-control"
             name="length" [(ngModel)]="trip.length" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Start Date</label>
      <input type="date" class="form-control"
             name="start" [(ngModel)]="trip.start" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Resort</label>
      <input type="text" class="form-control"
             name="resort" [(ngModel)]="trip.resort" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Price Per Person</label>
      <input type="text" class="form-control"
             name="perPerson" [(ngModel)]="trip.perPerson" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Image Filename</label>
      <input type="text" class="form-control"
             name="image" [(ngModel)]="trip.image" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea class="form-control" rows="3"
                name="description"
                [(ngModel)]="trip.description" required></textarea>
    </div>

    <button type="submit" class="btn btn-primary">
      Save Trip
    </button>

  </form>
</div>
